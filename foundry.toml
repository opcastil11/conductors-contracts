# Foundry config — fuzz/invariant suite alongside the Hardhat JS tests.
# Sources live in contracts/ (Hardhat layout); Solidity tests live in test/foundry/ so they
# don't collide with the *.test.js files Hardhat runs from test/.
[profile.default]
src = 'contracts'
test = 'test/foundry'
out = 'out'
libs = ['node_modules', 'lib']
solc_version = '0.8.24'
optimizer = true
optimizer_runs = 200
remappings = [
  '@openzeppelin/=node_modules/@openzeppelin/',
  'forge-std/=lib/forge-std/src/',
]

[fuzz]
runs = 512
max_test_rejects = 200000

[invariant]
runs = 128
depth = 48
fail_on_revert = false
