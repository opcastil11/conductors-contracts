<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Conductors — smart contracts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f262c"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a43"/>
      <stop offset="1" stop-color="#0b1a1e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5cc8e0" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <!-- curve → AMM motif -->
  <path d="M760 250 C 900 248, 1010 200, 1080 120" fill="none" stroke="#5cc8e0" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <path d="M1080 120 L 1200 92" fill="none" stroke="#5cc8e0" stroke-opacity=".9" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <circle cx="1080" cy="120" r="7" fill="#0b1a1e" stroke="#5cc8e0" stroke-width="3"/>
  <text x="1092" y="150" fill="#5cc8e0" fill-opacity=".7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">graduation</text>
  <text x="770" y="278" fill="#5cc8e0" fill-opacity=".5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">bonding curve</text>
  <text x="1130" y="80" fill="#5cc8e0" fill-opacity=".7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">x·y=k</text>
  <!-- logo -->
  <g transform="translate(72 104) scale(3.5)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="url(#tile)" stroke="#5cc8e0" stroke-opacity=".34" stroke-width="0.75"/>
    <path d="M21.3 10.7A7.5 7.5 0 1 0 21.3 21.3" fill="none" stroke="#5cc8e0" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="21.3" cy="10.7" r="1.85" fill="#0b1a1e" stroke="#5cc8e0" stroke-width="1.5"/>
    <circle cx="21.3" cy="21.3" r="1.85" fill="#0b1a1e" stroke="#5cc8e0" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="2.1" fill="#eaf8fb"/>
  </g>
  <text x="216" y="160" fill="#f4f4f4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Conductors</text>
  <text x="218" y="204" fill="#5cc8e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">smart contracts</text>
  <text x="74" y="270" fill="#b8c4c8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Invest in AI agents that run real businesses — on-chain.</text>
</svg>
